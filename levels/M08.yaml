title: Stacked branches
difficulty: medium
daily-date: null
concepts: [rebase, stacks]

brief: |
  Dan split a big change into two branches, `part2` built on top of `part1`,
  then left them to go stale while `main` moved on.

  Rebase so `part1` sits on the latest `main`, and `part2` still sits on top of `part1`.
  Neither branch should contain the old copies.

setup:
  - git commit
  - git switch -c part1
  - git commit -m "Add API client"
  - git commit -m "Add API tests"
  - git switch -c part2
  - git commit -m "Use API in UI"
  - git switch main
  - git commit -m "Update CI"

solution:
  - git switch part1
  - git rebase main
  - git switch part2
  - git rebase part1

goal:
  - on-top-of: { ref: part1, base: C5 }
  - on-top-of: { ref: part2, base: part1 }
  - contains: { ref: part2, changes: [C2, C3, C4] }
  - excludes: { ref: part1, changes: [C4] }
  - linear: part2
