title: Hotfix everywhere
difficulty: medium
daily-date: null
concepts: [merge, fast-forward]

brief: |
  Dan shipped a security bug. Nikita has already fixed it (`C3`) on `hotfix`, branched from `release`.
  Meanwhile Dan's next feature (`C2`) landed on `main`, and it isn't ready to ship.

  Matt wants the fix everywhere. Merge `hotfix` into both `release` and `main`,
  without rewriting `main`'s history and without shipping Dan's feature to `release`.

setup:
  - git commit
  - git branch release
  - git commit -m "New feature"
  - git switch -c hotfix release
  - git commit -m "Fix security bug"
  - git switch release

solution:
  - git merge hotfix
  - git switch main
  - git merge hotfix

goal:
  - merged: { from: C3, into: release }
  - merged: { from: C3, into: main }
  - on-top-of: { ref: main, base: C2 }
  - excludes: { ref: release, changes: [C2] }
  - no-duplicates: main
