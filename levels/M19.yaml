title: Before the first reset
difficulty: medium
daily-date: 2026-10-15
concepts: [reflog, "main@{n}", reset]

brief: |
  Dan has been "tidying up" `main` on his laptop (nothing's pushed): three `git reset --hard`s, with a few
  commits in between. The faded commits he left behind are all in the graph, but nothing says which is which.

  Matt wants `main` exactly as it was before Dan's *first* reset. `git reflog show main` lists every move
  `main` has made, newest first, and `main@{n}` names the commit it was at *n* moves ago.

setup:
  - git commit -m "Add cart"
  - git switch -c experiment
  - git commit -m "Try new cart layout"
  - git commit -m "Cart layout tweaks"
  - git switch main
  - git commit -m "Add wishlist"
  - git commit -m "Wishlist sharing"
  - git reset --hard experiment
  - git branch -D experiment
  - git commit -m "Cart totals"
  - git reset --hard HEAD~2
  - git commit -m "Wishlist sharing"
  - git reset --hard C1

solution:
  - git reset --hard main@{5}

goal:
  - points-to: { branch: main, commit: C5 }
    say: "`main` is back where it was before Dan's first reset"
  - head: main
