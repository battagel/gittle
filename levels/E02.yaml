title: Branching out
difficulty: easy
daily-date: null
concepts: [branch, switch]

brief: |
  Matt has given you your first feature. Everyone shares `main`, so new work happens on a
  *branch*: just another label pointing at a commit.

  Create a branch called `feature`, switch to it, and make a commit there.

setup:
  - git commit

solution:
  - git branch feature
  - git switch feature
  - git commit

goal:
  - head: feature
  - ahead: { ref: feature, of: main }
  - ahead: { ref: feature, of: C1 }
