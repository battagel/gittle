title: Too soon
difficulty: pro
daily-date: 2026-10-08
concepts: [rebase --onto, merge]

brief: |
  Dan merged the half-done `feature` into `main` too early (`C4`),
  and Nikita's "Update docs" (`C5`) has landed on top of it. Nobody has pulled `main` yet,
  so Matt wants the merge gone before anyone does.

  Get `feature`'s work out of `main`'s history, but keep everything else (`C1`, `C3` and `C5`).

setup:
  - git commit
  - git switch -c feature
  - git commit -m "Half-done feature"
  - git switch main
  - git commit -m "Fix login"
  - git merge feature
  - git commit -m "Update docs"

solution:
  - git reset --hard C3
  - git cherry-pick C5

goal:
  - excludes: { ref: main, changes: [C2] }
  - contains: { ref: main, changes: [C1, C3, C5] }
